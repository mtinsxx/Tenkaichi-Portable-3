name: Tenkaichi Portable 3 - PSP test build

# Build experimental PSP homebrew for a first manual PPSSPP test.
# Never uploads game data or publishes a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/portable-3-test.yml
      - "port/psp/**"
      - "port/include/**"
      - "include/battle/**"

permissions:
  contents: read

jobs:
  psp-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test portable controls
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_psp_controls.c -o /tmp/psp-controls-test
          /tmp/psp-controls-test

      - name: Test white font and menu blending
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror \
            port/psp/test_gs_white_modulate.c -o /tmp/psp-white-font-test
          /tmp/psp-white-font-test
          gcc -std=c99 -O2 -Wall -Wextra -Werror \
            port/psp/test_gs_text_blend.c -o /tmp/psp-font-blend-test
          /tmp/psp-font-blend-test

      - name: Test native stage clip reuse and texture-cache index lifetime
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_stage4.c -lm -o /tmp/tp3-stage4-parity
          /tmp/tp3-stage4-parity
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_tex_reuse.c -o /tmp/tp3-texture-index
          /tmp/tp3-texture-index
          python3 port/psp/test_arch_safety.py

      - name: Test PSP target freshness and enlarged GS texture hot cache
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_target_lifetime.c -o /tmp/tp3-target
          /tmp/tp3-target
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_tex_reuse.c -o /tmp/tp3-tex-reuse
          /tmp/tp3-tex-reuse
          python3 port/psp/test_arch_safety.py

      - name: Test GS source page generations after unrelated uploads
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_tex_reuse.c -o /tmp/tp3-tex-pages
          /tmp/tp3-tex-pages
          python3 port/psp/test_arch_safety.py

      - name: Test VU1 stage399 cached clip/project and fallback bounds
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_stage_clip_cache.c -lm -o /tmp/tp3-stage-fans
          /tmp/tp3-stage-fans

      - name: Test bounded PSP renderer LOG_ALL incident collection
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_log_all.c -o /tmp/tp3-log-all
          /tmp/tp3-log-all
          python3 port/psp/test_arch_safety.py
          python3 port/psp/test_native_diagnostics.py

      - name: Test distinct GS 336 and 368 PSP work framebuffer ownership
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_work_pair.c -o /tmp/tp3-work-pair
          /tmp/tp3-work-pair

      - name: Test intra-frame texture eviction LRU order
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_tex_lru.c -o /tmp/tp3-texture-lru
          /tmp/tp3-texture-lru

      - name: Test GE-completed framebuffer output sampling
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_gpu_probe.c -o /tmp/tp3-gpu-probe
          /tmp/tp3-gpu-probe

      - name: Test PSP MPEG-2 quantization exact arithmetic parity
        run: |
          set -euo pipefail
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iport/psp \
            port/psp/test_mpeg_quant.c -o /tmp/tp3-mpeg-quant
          /tmp/tp3-mpeg-quant

      - name: Compile PSP EBOOT using official pspdev SDK
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --env PSPDEV=/usr/local/pspdev \
            pspdev/pspdev:v20261001 \
            sh -ec '
              if ! command -v python3 >/dev/null 2>&1; then
                if command -v apk >/dev/null 2>&1; then
                  apk add --no-cache python3
                elif command -v apt-get >/dev/null 2>&1; then
                  apt-get update
                  apt-get install -y --no-install-recommends python3
                else
                  echo "No supported package manager for Python 3"
                  exit 1
                fi
              fi
              export PATH="$PSPDEV/bin:$PATH"
              command -v psp-gcc
              psp-gcc --version | head -1
              python3 port/psp/build.py
              test -s port/build/psp_rel/EBOOT.PBP
            '

      - name: Check PSP EBOOT header, executable and 64 MB flag
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          path = Path("port/build/psp_rel/EBOOT.PBP")
          data = path.read_bytes()
          assert len(data) > 0x28, "Empty or truncated PBP"
          assert data[:4] == b"\x00PBP", "Invalid PBP signature"
          offsets = struct.unpack_from("<8I", data, 8)
          assert 0x28 <= offsets[0] < len(data), "Bad PARAM.SFO offset"
          assert all(a <= b for a, b in zip(offsets, offsets[1:])), "Invalid PBP offsets"
          assert offsets[-1] <= len(data), "PBP section past end"
          assert data[offsets[0]:offsets[0] + 4] == b"\x00PSF", "PARAM.SFO missing"
          assert data[offsets[6]:offsets[6] + 4] == b"\x7fELF", "PSP ELF missing"
          assert b"MEMSIZE" in data[offsets[0]:offsets[1]], "64 MB MEMSIZE field missing"
          print("PBP verified:", len(data), "bytes")
          PY

      - name: Prepare PPSSPP test package (no game assets)
        run: |
          set -euo pipefail
          mkdir -p dist/PSP/GAME/BT3
          cp port/build/psp_rel/EBOOT.PBP dist/PSP/GAME/BT3/EBOOT.PBP
          # No bt3.txt: EBOOT already includes LOG_ALL, profiler and controls.
          cat > dist/LEIA-ME.txt <<'EOF'
          TENKAICHI PORTABLE 3 - BUILD EXPERIMENTAL PARA TESTES

          1. Extraia a pasta PSP/GAME/BT3 no diretorio de memory stick do PPSSPP.
          2. O arquivo EBOOT.PBP e o programa compilado para PSP.
          3. Basta iniciar EBOOT.PBP. LOG_ALL, FPS, comandos portable,
             e profundidade normal estao compilados no executavel.
             Nenhum bt3.txt e necessario nem lido.
          4. Nao inclui dados comerciais do jogo: coloque os seus
             arquivos USA SLUS-21678 em PSP/GAME/BT3/disc/.
          5. Teste 10 a 20 segundos de batalha e envie o arquivo
             PSP/GAME/BT3/log.txt inteiro.
          6. Esse diagnostico pode reduzir o FPS; nao serve como
             referencia de desempenho ate o LOG_ALL ser desativado
             numa build normal de producao.
          7. saves/ e bt3_settings.txt do jogo sao preservados.
          8. EBOOT compilado nao significa que os cenarios ja funcionem.
          EOF

      - name: Upload EBOOT test package
        uses: actions/upload-artifact@v4
        with:
          name: Tenkaichi-Portable-3-PSP-Test
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload link diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Tenkaichi-Portable-3-Build-Diagnostics
          path: |
            port/build/gen/psp_rel/missing_symbols.txt
            port/build/gen/psp_rel/missing_callers.tsv
            port/build/psp_rel/bt3.map
          if-no-files-found: ignore
          retention-days: 14
